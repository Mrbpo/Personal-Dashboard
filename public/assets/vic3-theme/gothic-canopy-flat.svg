<svg xmlns="http://www.w3.org/2000/svg" width="360" height="128" viewBox="0 0 360 128">
  <!-- Seamless bay: both edges are the centre line of the same shared pier. -->
  <path fill="#342218" d="M0 0h360v18H0z"/>
  <path fill="#62442f" d="M0 3h360v7H0z"/>
  <path fill="#a27d4c" d="M0 10h360v2H0z"/>
  <path fill="#4b3022" d="M0 18h360v9H0z"/>
  <path fill="#b08a54" d="M0 24h360v2H0z"/>

  <!-- One large, readable Gothic arch. -->
  <path d="M7 128C63 83 124 52 180 35C236 52 297 83 353 128" fill="none" stroke="#342117" stroke-width="20" stroke-linejoin="miter"/>
  <path d="M7 128C63 83 124 52 180 35C236 52 297 83 353 128" fill="none" stroke="#68472f" stroke-width="12" stroke-linejoin="miter"/>
  <path d="M7 128C63 83 124 52 180 35C236 52 297 83 353 128" fill="none" stroke="#ad8550" stroke-width="2" stroke-linejoin="miter"/>

  <!-- Shared half-piers close perfectly when repeated. -->
  <path fill="#342117" d="M0 18h13v110H0zM347 18h13v110h-13z"/>
  <path fill="#68472f" d="M0 24h8v104H0zM352 24h8v104h-8z"/>
  <path fill="#ad8550" d="M5 26h2v102H5zM353 26h2v102h-2z"/>
  <path fill="#342117" d="M0 48h19v10H0zM341 48h19v10h-19z"/>
  <path fill="#805a38" d="M0 50h16v5H0zM344 50h16v5h-16z"/>

  <!-- Flat quatrefoil crest; no bevels or photographic shading. -->
  <g transform="translate(180 21)">
    <circle r="17" fill="#342117"/>
    <circle cy="-7" r="7" fill="#745039"/>
    <circle cx="7" r="7" fill="#745039"/>
    <circle cy="7" r="7" fill="#745039"/>
    <circle cx="-7" r="7" fill="#745039"/>
    <circle r="4" fill="#c09a5d"/>
  </g>

  <!-- Sparse tracery sized for a navigation bar, not miniature filigree. -->
  <path d="M26 37C62 30 89 31 118 42M334 37C298 30 271 31 242 42" fill="none" stroke="#6d4a31" stroke-width="7" stroke-linecap="round"/>
  <path d="M26 37C62 30 89 31 118 42M334 37C298 30 271 31 242 42" fill="none" stroke="#aa824e" stroke-width="1.5" stroke-linecap="round"/>
  <path fill="#735036" d="M55 30l10-9 9 10-10 8zM305 30l-10-9-9 10 10 8z"/>

  <!-- Single pendant at the point of the arch. -->
  <path fill="#3b261a" d="M174 34h12v31l-6 11-6-11z"/>
  <path fill="#8b633d" d="M178 39h4v27l-2 5-2-5z"/>
  <path fill="#b08a54" d="M171 61h18v4h-18z"/>
</svg>
