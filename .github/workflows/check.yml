name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ':memory:'
      KERNEL_DATABASE_URL: 'postgresql://study_kernel:test-password@localhost:5432/study_kernel'
      SERVICE_VAULT_DIR: /tmp/study-ci-vault
      CHATGPT_AUTO: 'false'
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: study_kernel
          POSTGRES_USER: study_kernel
          POSTGRES_PASSWORD: test-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U study_kernel -d study_kernel"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install the pinned vector extension in the PostgreSQL service
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          bash deploy/prepare-vector-ci.sh "$POSTGRES_CONTAINER"
      - run: npm ci
      - name: Install native PDF text tools for ingestion checks
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: python3 -m unittest discover -s scripts/course-video -p 'test_*.py'
      - run: npm test
      - run: npm run kernel:test
      - run: npx tsc --noEmit
      - run: bash -n deploy/*.sh
      - run: node scripts/check-migrations.mjs
      - run: npm run build
      - name: Build and smoke-test the production container
        run: |
          docker build --build-arg APP_VERSION="$GITHUB_SHA" -t "study-cabinet:$GITHUB_SHA" .
          bash deploy/smoke-container.sh "study-cabinet:$GITHUB_SHA"
