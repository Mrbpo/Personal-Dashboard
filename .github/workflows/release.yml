name: Release production
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.prerelease && !github.event.release.draft)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ':memory:'
      KERNEL_DATABASE_URL: 'postgresql://study_kernel:test-password@localhost:5432/study_kernel'
      SERVICE_VAULT_DIR: /tmp/study-release-vault
      CHATGPT_AUTO: 'false'
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: study_kernel
          POSTGRES_USER: study_kernel
          POSTGRES_PASSWORD: test-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U study_kernel -d study_kernel"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate published release and main ancestry
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '(.draft == false) and (.prerelease == false)' | grep -qx true
          sha=$(git rev-parse "refs/tags/$TAG^{commit}")
          git merge-base --is-ancestor "$sha" origin/main
          git checkout --detach "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare the pinned PostgreSQL vector runtime
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: bash deploy/prepare-vector-ci.sh "$POSTGRES_CONTAINER"
      - run: npm ci
      - name: Install native PDF text tools for ingestion checks
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Verify release tag matches package version
        env:
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: node --input-type=module -e "import fs from 'node:fs'; if ('v'+JSON.parse(fs.readFileSync('package.json','utf8')).version!==process.env.TAG) process.exit(1)"
      - run: npm test
      - run: npm run kernel:test
      - run: npx tsc --noEmit
      - run: node scripts/check-migrations.mjs
      - name: Build immutable image without private data
        env:
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          docker build --build-arg APP_VERSION="$SHA" -t "study-cabinet:$SHA" .
          bash deploy/smoke-container.sh "study-cabinet:$SHA"
      - name: Deploy through restricted command
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          docker save "study-cabinet:$SHA" study-postgres:18.6-pgvector0.8.7 | gzip | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "deploy $SHA"
