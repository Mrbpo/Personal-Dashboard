name: Validate server Codex maintenance
on:
  push:
    branches:
      - 'codex/server-maintenance-*'
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: server-codex-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-and-propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: node scripts/check-migrations.mjs
      - run: npm run build
      - name: Open a reviewable maintenance pull request
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          existing=$(gh pr list --head "$HEAD_BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh pr create --base main --head "$HEAD_BRANCH" --title "Server Codex maintenance" --body "Event-driven server maintenance generated from queued website feedback or a terminal background-job failure. All repository tests, type checks, migration checks, and the production build run before this proposal is created. Production deployment remains behind the formal release workflow."
          fi
