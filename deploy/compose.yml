services:
  web:
    image: study-cabinet:${APP_VERSION:?APP_VERSION required}
    restart: unless-stopped
    env_file: /srv/study/runtime.env
    environment:
      CLOUD_MODE: 'true'
      LOCAL_DEV_BYPASS_AUTH: 'false'
      DATABASE_URL: file:/app/data/course-radar-v2.db
      LIBRARY_DIR: /app/data/library
      SERVICE_VAULT_DIR: /app/data/private
      DOCLING_URL: http://docling:5001
    volumes:
      - /srv/study/data:/app/data
      - /srv/study/assets:/app/public/assets/vic3-theme:ro
      - /srv/study/status:/app/deploy-status:ro
    ports: ['127.0.0.1:3000:3000']
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    depends_on:
      postgres: {condition: service_healthy}
  worker:
    image: study-cabinet:${APP_VERSION:?APP_VERSION required}
    command: [npm, run, worker]
    restart: unless-stopped
    stop_grace_period: 180s
    env_file: /srv/study/runtime.env
    environment:
      CLOUD_MODE: 'true'
      SYNC_PRIMARY: 'true'
      LOCAL_OCR: 'true'
      DATABASE_URL: file:/app/data/course-radar-v2.db
      LIBRARY_DIR: /app/data/library
      SERVICE_VAULT_DIR: /app/data/private
      DOCLING_URL: http://docling:5001
    volumes: [/srv/study/data:/app/data]
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    depends_on:
      postgres: {condition: service_healthy}
      docling: {condition: service_started}
  postgres:
    image: study-postgres:18.6-pgvector0.8.7
    restart: unless-stopped
    environment:
      POSTGRES_DB: study_kernel
      POSTGRES_USER: study_kernel
      POSTGRES_PASSWORD_FILE: /run/secrets/kernel_postgres_password
      PGDATA: /var/lib/postgresql/18/docker
    secrets: [kernel_postgres_password]
    volumes: [kernel_postgres:/var/lib/postgresql]
    healthcheck:
      test: ['CMD-SHELL','pg_isready -U study_kernel -d study_kernel']
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: ['no-new-privileges:true']
  docling:
    image: ghcr.io/docling-project/docling-serve-cpu:v1.35.0
    restart: unless-stopped
    mem_limit: '4294967296'
    environment:
      DOCLING_SERVE_HOST: 0.0.0.0
      DOCLING_SERVE_PORT: '5001'
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: '1'
      DOCLING_SERVE_ENG_LOC_SHARE_MODELS: 'true'
      DOCLING_SERVE_LOAD_MODELS_AT_BOOT: 'false'
      DOCLING_SERVE_OPTIONS_CACHE_SIZE: '1'
      DOCLING_SERVE_ARTIFACTS_PATH: /opt/app-root/src/.cache/docling/models
    volumes:
      - /srv/study/docling-models/docling-project--CodeFormulaV2:/opt/app-root/src/.cache/docling/models/docling-project--CodeFormulaV2:ro
    security_opt: ['no-new-privileges:true']
  proxy:
    image: caddy:2
    restart: unless-stopped
    env_file: /srv/study/runtime.env
    ports: ['80:80','443:443']
    volumes:
      - /srv/study/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  kernel_postgres:
  caddy_data:
  caddy_config:
secrets:
  kernel_postgres_password:
    file: /srv/study/kernel-postgres-password
